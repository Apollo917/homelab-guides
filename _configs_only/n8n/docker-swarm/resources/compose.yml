services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.9
    environment:
      TZ: UTC
      GENERIC_TIMEZONE: UTC
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_WEBHOOK_METRICS: "true"
      N8N_METRICS_INCLUDE_FORM_METRICS: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_INFO: "true"
      N8N_LICENSE_ACTIVATION_KEY_FILE: /run/secrets/n8n_licence_key
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db_postgresql-16-mini
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_postgresdb_password
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - ./data:/home/node/.n8n
    secrets:
      - n8n_licence_key
      - n8n_postgresdb_password
      - n8n_runners_auth_token
    networks:
      - reverse-proxy # Same network as for Traefik
      - databases # Same network as for Databases
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.name == vesta
      labels:
        # Traefik integration labels - start
        - "traefik.enable=true"
        - "traefik.http.services.n8n.loadBalancer.server.port=5678"
        - "traefik.http.routers.n8n.service=n8n"
        - "traefik.http.routers.n8n.tls.certresolver=cloudflare"
        - "traefik.http.routers.n8n.entrypoints=private-https"
        - "traefik.http.routers.n8n.rule=Host(`n8n.<DOMAIN_NAME>`)"
        # Homepage integration labels - start
        - "homepage.group=Commons"
        - "homepage.name=n8n"
        - "homepage.icon=n8n"
        - "homepage.href=https://n8n.<DOMAIN_NAME>"

  n8n-runner:
    image: n8nio/runners:2.29.9
    environment:
      TZ: UTC
      GENERIC_TIMEZONE: UTC
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    secrets:
      - n8n_runners_auth_token
    networks:
      - reverse-proxy # Same network as for Traefik
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.name == vesta

networks:
  reverse-proxy:
    external: true
  databases:
    external: true

secrets:
  n8n_licence_key:
    external: true
  n8n_postgresdb_password:
    external: true
  n8n_runners_auth_token:
    external: true