services:
  postgresql-16:
    image: postgres:16-alpine
    user: <UID>:<GID>
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pwd
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale-provider=icu --icu-locale=und"
    secrets:
      - postgres_user
      - postgres_pwd
    networks:
      - databases
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == <HOST_NAME>

networks:
  databases:
    external: true

secrets:
  postgres_user:
    external: true
  postgres_pwd:
    external: true