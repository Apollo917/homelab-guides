name: "vaultwarden"
services:
  vaultwarden:
    image: vaultwarden/server:1.35.4
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/:/data/
    networks:
      - reverse-proxy
    labels:
      # Traefik integration labels - start
      - "traefik.enable=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden-secure.service=vaultwarden"
      - "traefik.http.routers.vaultwarden-secure.tls=true"
      - "traefik.http.routers.vaultwarden-secure.entrypoints=private-https"
      - "traefik.http.routers.vaultwarden-secure.rule=Host(`${VAULTWARDEN_SERVICE_URL:?error}`)" # e.g. vaultwarden.example.com
      # Traefik integration labels - end
networks:
  reverse-proxy:
    external: true
